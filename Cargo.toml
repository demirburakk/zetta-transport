[package]
name = "zetta-transport"
version = "0.1.26"
edition = "2024"
authors = ["Burak Demir <demirburak8338@gmail.com>"]
description = "An experimental encrypted, multiplexed transport protocol over UDP"
license = "MIT OR Apache-2.0"
keywords = ["networking", "protocol", "udp", "iot", "security"]
categories = ["network-programming", "cryptography"]
repository = "https://github.com/demirburakk/zetta-transport"
homepage = "https://github.com/demirburakk/zetta-transport"
documentation = "https://docs.rs/zetta-transport"
readme = "README.md"
exclude = [
    "/.github/",
    "/.vscode/",
    "/fuzz/",
]

[dependencies]
tokio = { version = "1.52", features = ["full"] }
bytes = "1.11"
chacha20poly1305 = "0.10"
x25519-dalek = "2.0"
sha2 = "0.11"
hkdf = "0.13"
hmac = "0.13"
thiserror = "2.0"

tracing = "0.1"
rand = "0.8"
dashmap = "6.1.0"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
chacha20 = "0.10.0"
zeroize = "1.8.1"
subtle = "2.6.1"
socket2 = "0.6.3"
num_cpus = "1.17.0"

[dev-dependencies]
tokio = { version = "1.52", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
testing = []

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "transport_roundtrip"
harness = false
